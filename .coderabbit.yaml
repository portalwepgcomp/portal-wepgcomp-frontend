# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: pt-BR
early_access: false
enable_free_tier: true
tone_instructions: >
  Seja profissional e objetivo. Priorize bugs, regressões, riscos de segurança,
  problemas de acessibilidade e qualidade do código. Evite nits cosméticos e
  sugestões especulativas sem evidência no diff.

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
    ignore_title_keywords:
      - WIP
      - "DO NOT MERGE"
  path_filters:
    - "!**/node_modules/**"
    - "!**/package-lock.json"
    - "!**/pnpm-lock.yaml"
    - "!**/yarn.lock"
    - "!**/dist/**"
    - "!**/.next/**"
    - "!**/coverage/**"
    - "!**/cypress/videos/**"
    - "!**/cypress/screenshots/**"
    - "!**/*.min.js"
    - "!**/*.map"
    - "!**/*.svg"
    - "!**/*.png"
    - "!**/*.jpg"
    - "!**/*.jpeg"
    - "!**/*.webp"
    - "!**/*.ico"
  path_instructions:
    - path: "**/*.{ts,tsx,js,jsx}"
      instructions: |
        Foque em bugs, regressões e segurança no frontend Next.js/React.
        Verifique vazamento de secrets, tratamento de erros de API, estados
        de loading/erro, tipagem TypeScript e acessibilidade básica.
        Prefira apontar problemas concretos no diff a refatorações amplas.
    - path: "**/*.{css,scss}"
      instructions: |
        Revise apenas problemas que afetem layout, responsividade ou
        acessibilidade. Ignore preferências de estilo cosméticas.

chat:
  auto_reply: true
