name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  build:
    name: Typecheck + Lint + Test + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --ci --coverage=false

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001

      - name: Audit (report-only)
        run: npm audit --audit-level=high || true

      - name: Validate production Docker build (Alpine)
        # Builda a imagem real de produção (node:22-alpine/musl) para pegar problemas
        # que só aparecem nesse ambiente (ex.: package-lock.json desincronizado que passa
        # no npm ci do runner glibc do CI, mas falha no build do Dokku em Alpine/musl).
        run: docker build -t ci-image-check:${{ github.sha }} .
