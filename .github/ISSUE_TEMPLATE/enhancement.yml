name: Melhoria / Tarefa
description: Nova funcionalidade, ajuste ou tarefa técnica
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: descricao
    attributes:
      label: Descrição
      description: O que deve ser feito e por quê.
      placeholder: Ex.: Usuário autenticado edita o próprio perfil pela UI.
    validations:
      required: true
  - type: textarea
    id: detalhes
    attributes:
      label: Detalhes
      description: Escopo da mudança, campos, telas, regras (opcional).
  - type: textarea
    id: notas
    attributes:
      label: Notas
      description: Hipótese técnica, arquivos, link do outro repo, etc. (opcional)
