name: Bug
description: Reportar um comportamento incorreto ou falha
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: mini
    attributes:
      label: Mini descrição (obrigatório)
      description: 1–3 frases do problema e impacto.
      placeholder: Ex.: Na tela de login o formulário fica no topo e não centraliza verticalmente.
    validations:
      required: true
  - type: dropdown
    id: escopo
    attributes:
      label: Escopo deste repositório
      options:
        - Frontend (UI / Next)
        - Backend (API / Nest) — use só se este for o repo da API
        - Ambos (vincular issue no outro repo)
    validations:
      required: true
  - type: input
    id: ambiente
    attributes:
      label: Ambiente
      placeholder: local / staging / produção
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Passos para reproduzir
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Comportamento esperado
    validations:
      required: true
  - type: textarea
    id: atual
    attributes:
      label: Comportamento atual
    validations:
      required: true
  - type: textarea
    id: evidencias
    attributes:
      label: Evidências
      description: Prints, URL, console, request/response (sem senhas/tokens).
  - type: textarea
    id: relacionados
    attributes:
      label: Issues / PRs relacionados
      description: Links do outro repo (front↔api) quando o bug for cross-cutting.
      placeholder: "Ex.: portal-wepgcomp-api#12"
  - type: textarea
    id: aceite
    attributes:
      label: Critérios de aceite
      placeholder: |
        - [ ] …
    validations:
      required: true
